<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نیروانا ماساژ | کارت ویزیت دیجیتال</title>

  <!-- بخش اول: سئو و موتورهای جستجو (SEO) -->
  <meta name="description" content="کارت ویزیت دیجیتال نیروانا ماساژ - رزرو نوبت و دریافت اطلاعات تماس، آدرس و شبکه های اجتماعی">
  <meta name="keywords" content="نیروانا ماساژ, ماساژ درمانی, رزرو نوبت ماساژ, کارت ویزیت دیجیتال, nirvana spa">
  <meta name="author" content="Nirvana Massage">
  
  <!-- بخش دوم: پیش‌نمایش شبکه های اجتماعی (Open Graph) -->
  <meta property="og:title" content="نیروانا ماساژ">
  <meta property="og:description" content="بازیابی سلامت جسمانی شما تخصص ماست">
  <meta property="og:image" content="logo.png">
  <meta property="og:type" content="website">

  <!-- بخش سوم: فاوآیکون (آیکون کوچک مرورگر) -->
  <link rel="icon" type="image/png" href="Pictures/IMG_20260504_232004.jpg">

  <!-- بخش چهارم: قابلیت ذخیره به عنوان وب‌اپلیکیشن (PWA Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="نیروانا">
  <link rel="apple-touch-icon" href="Pictures/IMG_20260504_232004.jpg">

  <!-- لینک دادن به فایل استایل اصلی -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- بخش لودینگ اختصاصی -->
  <div id="loader">
    <img src="Pictures/logo.webp" alt="Nirvana Logo" class="loader-logo">
  </div>

  <!-- لایه نور آرام‌بخش پس‌زمینه -->
  <div class="ambient-light"></div>

  <!-- دکمه تغییر تم (تاریک/روشن) -->
  <button class="theme-toggle" id="themeToggle" aria-label="تغییر حالت شب و روز">🌙</button>

  <!-- هیرو اصلی: لوگو، عنوان و توضیحات کوتاه -->
  <header class="hero">
    <img src="Pictures/IMG_20260504_232004.jpg" alt="لوگوی نیروانا ماساژ" class="logo">
    <h1>نیروانا ماساژ</h1>
    <p class="subtitle">بازیابی سلامت جسمانی شما تخصص ماست</p>
  </header>

  <!-- بخش دکمه‌های ارتباطی و اکشن‌ها -->
  <main class="hero" style="padding-top: 0;">
    <div class="actions">
      <p class="hint-text">رزرو نوبت و دریافت نشانی از روش‌های زیر امکان‌پذیر است</p>
      
      <!-- دکمه تماس مستقیم (شماره فرضی است، در صورت نیاز به شماره واقعی تغییر دهید) -->
      <a href="tel:+989131234567" class="btn primary-btn" id="callBtn">
        <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h2.28a1 1 0 01.94.725l.548 2.2a1 1 0 01-.321.988l-1.305.98a10.582 10.582 0 004.872 4.872l.98-1.305a1 1 0 01.988-.321l2.2.548a1 1 0 01.725.94V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
        </svg>
        تماس تلفنی با مطب
      </a>

      <!-- دکمه کپی شماره پیامک (فقط در موبایل نمایش داده می‌شود) -->
      <button class="btn secondary-btn" id="smsBtn">
        <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
        </svg>
        ارسال پیامک (دریافت آدرس)
      </button>

      <!-- دکمه ورود به پیام‌رسان بله -->
      <a href="https://ble.ir/nirvanaspa" target="_blank" rel="noopener noreferrer" class="btn secondary-btn" id="messengerBtn">
        <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
        </svg>
        پیام در پیام‌رسان بله
      </a>

      <!-- دکمه اشتراک‌گذاری کارت ویزیت (قابلیت بومی Share گوشی) -->
      <button class="btn secondary-btn" id="shareBtn">
        <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 10.748L15 12m0 0l-6.316 1.252m6.316-1.252a3 3 0 110-3.156 3 3 0 010 3.156zm-10.368-2.52a3 3 0 110-4.5 3 3 0 010 4.5zm0 6.316a3 3 0 110-4.5 3 3 0 010 4.5z"></path>
        </svg>
        اشتراک‌گذاری کارت ویزیت
      </button>

      <!-- دکمه غیرفعال وب‌سایت اصلی -->
      <button class="btn disabled-btn" disabled>
        <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path>
        </svg>
        وب‌سایت رسمی (به‌زودی)
      </button>
    </div>
  </main>

  <!-- توست پیام موفقیت کپی شدن شماره موبایل -->
  <div class="toast" id="toast">شماره کپی شد! می‌توانید آن را پیامک کنید.</div>

  <!-- فوتر ساده -->
  <footer>
    Nirvana Premium Experience 2026 ©
  </footer>

  <!-- لینک دادن به فایل جاوااسکریپت -->
  <script src="script.js"></script>
</body>
</html>
